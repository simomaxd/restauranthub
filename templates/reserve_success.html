<!DOCTYPE html>
<html lang="{{ current_lang }}" dir="{{ 'rtl' if current_lang == 'ar' else 'ltr' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ t.reservation_confirmed }} - {{ t.site_name }}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { margin: 0; padding: 0; background-color: #0b0e14; color: #e0e0e0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .navbar { background-color: #1a1f2b !important; border-bottom: 1px solid #2e3a4a; }
        .navbar-brand { color: #00d4ff !important; font-weight: bold; font-size: 1.4rem; letter-spacing: 0.5px; }
        h1 { color: #00d4ff; font-weight: 700; font-size: 2rem; letter-spacing: 1px; }
        p { font-size: 1.05rem; line-height: 1.7; color: #b0b0b0; }
        .btn-info { background-color: #00d4ff; border: none; color: #0b0e14; font-weight: 600; border-radius: 8px; padding: 10px 24px; }
        .btn-info:hover { background-color: #00b3d9; color: #0b0e14; }
        .btn-outline-info { border: 1px solid #00d4ff; color: #00d4ff; border-radius: 8px; padding: 10px 24px; }
        .btn-outline-info:hover { background-color: #00d4ff; color: #0b0e14; }
        footer { border-top: 1px solid #2e3a4a; color: #666; font-size: 0.9rem; }

        /* Light Mode */
        body.light-mode { background-color: #f8f9fa !important; color: #333 !important; }
        body.light-mode .navbar { background-color: #ffffff !important; border-bottom: 1px solid #dee2e6; }
        body.light-mode .navbar-brand { color: #007bff !important; }
        body.light-mode .nav-link { color: #333 !important; }
        body.light-mode .nav-link:hover { color: #007bff !important; }
        body.light-mode h1 { color: #007bff; }
        body.light-mode p { color: #555; }
        body.light-mode footer { border-top: 1px solid #dee2e6; color: #888; }
        body.light-mode .navbar-toggler-icon {
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3e%3cpath stroke='rgba(0, 0, 0, 0.7)' stroke-linecap='round' stroke-miterlimit='10' stroke-width='2' d='M4 7h22M4 15h22M4 23h22'/%3e%3c/svg%3e") !important;
        }
        body.light-mode .navbar-toggler { border-color: #333 !important; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="/">🍽️ {{ t.site_name }}</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item"><a class="nav-link" href="/">{{ t.home }}</a></li>
                    <li class="nav-item"><a class="nav-link" href="/reserve">{{ t.reserve }}</a></li>
                    <li class="nav-item ms-2">
                        <button id="theme-toggle" class="btn btn-sm btn-outline-info">🌙</button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5 text-center">
        <h1>✅ {{ t.reservation_confirmed }}</h1>
        <p class="mt-3">{{ t.thank_you_reservation }}</p>
        <p>{{ t.earned_points }} 🎉</p>
        <a href="/" class="btn btn-info mt-3">{{ t.back_to_menu }}</a>
        <a href="/loyalty" class="btn btn-outline-info mt-3">{{ t.check_points }}</a>
    </div>

    <footer class="text-center mt-5 py-4">
        <p>&copy; 2026 {{ t.site_name }}. All rights reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const toggleBtn = document.getElementById('theme-toggle');
        const currentTheme = localStorage.getItem('theme') || 'dark';

        if (currentTheme === 'light') {
            document.body.classList.add('light-mode');
            toggleBtn.textContent = '☀️';
        }

        toggleBtn.addEventListener('click', () => {
            document.body.classList.toggle('light-mode');
            const isLight = document.body.classList.contains('light-mode');
            localStorage.setItem('theme', isLight ? 'light' : 'dark');
            toggleBtn.textContent = isLight ? '☀️' : '🌙';
        });
    </script>
</body>
</html>
